controller_manager:
  ros__parameters:
    update_rate: 10 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - arm_joint_1
      - arm_joint_2

    command_interfaces:
      - position
      # - velocity

    state_interfaces:
      - position
      # - velocity

    open_loop_control: true
    allow_integration_in_goal_trajectories: true

gripper_controller:
  ros__parameters:
    joints:
      - gripper_joint_1

    command_interfaces:
      - position
      # - velocity

    state_interfaces:
      - position
      # - velocity

    open_loop_control: true
    allow_integration_in_goal_trajectories: true
